<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quejas | CBTIS 128</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="page-body">
    <header class="site-header">
      <div class="container nav">
        <div class="brand">CBTIS 128</div>
        <nav class="menu">
          <a href="index.html">Inicio</a>
          <a href="informacion.html">Información</a>
          <a href="quejas.html">Quejas</a>
          <a href="reportes.html">Reportes</a>
          <a href="contacto.html">Contacto</a>
        </nav>
      </div>
    </header>

    <main class="container page-main">
      <section class="page-banner">
        <p class="eyebrow">Reporte de incidencias</p>
        <h1>¿Dónde se encuentra tu queja?</h1>
      </section>

      <form class="report-form" id="formReporte">
        <div class="form-grid">
          <label>
            <span>Tipo de lugar</span>
            <select name="lugar" required>
              <option value="">Selecciona una opción</option>
              <option>Centro de cómputo</option>
              <option>Laboratorio</option>
              <option>Salón</option>
              <option>Cancha de futbol</option>
              <option>Cancha de basquetbol</option>
              <option>Biblioteca</option>
              <option>Cafetería</option>
              <option>Instalación en general</option>
            </select>
          </label>

          <label>
            <span>Salón o aula</span>
            <select name="aula" required>
              <option value="">Selecciona el aula</option>
              <option>1</option>
              <option>2</option>
              <option>3</option>
              <option>4</option>
              <option>5</option>
              <option>6</option>
              <option>7</option>
              <option>8</option>
              <option>9</option>
              <option>10</option>
              <option>11</option>
              <option>12</option>
              <option>13</option>
              <option>14</option>
              <option>15</option>
              <option>16</option>
              <option>17</option>
              <option>18</option>
              <option>19</option>
              <option>20</option>
              <option>21</option>
              <option>22</option>
              <option>23</option>
              <option>24</option>
              <option>25</option>
              <option>26</option>
              <option>27</option>
              <option>28</option>
              <option>29</option>
              <option>30</option>
              <option>31</option>
              <option>32</option>
              <option>33</option>
              <option>34</option>
              <option>35</option>
              <option>36</option>
              <option>37</option>
              <option>38</option>
              <option>39</option>
              <option>40</option>
              <option>41</option>
            </select>
          </label>
        </div>

        <label>
          <span>Descripción de la situación</span>
          <textarea
            name="descripcion"
            rows="6"
            placeholder="Describe el problema, el daño o la incidencia que se presenta..."
            required
          ></textarea>
        </label>

        <div class="upload-box">
          <label class="upload-label">
            <span>Adjuntar foto de la problemática</span>
            <input id="fotoReporte" type="file" name="foto" accept="image/*" />
          </label>
          <small>Ejemplo: foto de un daño en la pared, equipo, laboratorio o cancha.</small>
          <div class="preview-box">
            <img id="previewFoto" alt="Vista previa de la imagen seleccionada" />
          </div>
        </div>

        <div class="form-grid">
          <label>
            <span>Prioridad</span>
            <select name="prioridad" required>
              <option value="">Selecciona prioridad</option>
              <option>Baja</option>
              <option>Media</option>
              <option>Alta</option>
            </select>
          </label>

          <label>
            <span>Nombre del reportante</span>
            <input type="text" name="nombre" placeholder="Tu nombre" required />
          </label>
        </div>

        <button type="submit" class="btn btn-primary full-width">Enviar reporte</button>
      </form>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>CBTIS 128 • Cuidado de instalaciones</p>
      </div>
    </footer>

    <script>
      const inputFoto = document.getElementById('fotoReporte');
      const previewFoto = document.getElementById('previewFoto');
      const formReporte = document.getElementById('formReporte');

      inputFoto.addEventListener('change', function () {
        const archivo = this.files[0];

        if (archivo) {
          const lector = new FileReader();

          lector.onload = function (event) {
            previewFoto.src = event.target.result;
            previewFoto.style.display = 'block';
          };

          lector.readAsDataURL(archivo);
        }
      });

      formReporte.addEventListener('submit', function (event) {
        event.preventDefault();

        const formData = new FormData(formReporte);
        const lugar = formData.get('lugar');
        const aula = formData.get('aula');
        const descripcion = formData.get('descripcion');
        const prioridad = formData.get('prioridad');
        const nombre = formData.get('nombre');
        const archivo = inputFoto.files[0];

        const nuevoReporte = {
          id: Date.now(),
          lugar,
          aula,
          descripcion,
          prioridad,
          nombre,
          fecha: new Date().toLocaleDateString('es-MX'),
          foto: archivo ? '' : '',
          estado: 'Pendiente'
        };

        if (archivo) {
          const lector = new FileReader();

          lector.onload = function (event) {
            nuevoReporte.foto = event.target.result;
            guardarReporte(nuevoReporte);
            alert('Tu reporte ha sido registrado correctamente.');
            formReporte.reset();
            previewFoto.style.display = 'none';
            previewFoto.src = '';
            window.location.href = 'reportes.html';
          };

          lector.readAsDataURL(archivo);
        } else {
          guardarReporte(nuevoReporte);
          alert('Tu reporte ha sido registrado correctamente.');
          formReporte.reset();
          previewFoto.style.display = 'none';
          previewFoto.src = '';
          window.location.href = 'reportes.html';
        }
      });

      function guardarReporte(reporte) {
        const clave = 'cbtis128_reportes';
        const anteriores = JSON.parse(localStorage.getItem(clave) || '[]');
        const lista = [reporte, ...anteriores];
        localStorage.setItem(clave, JSON.stringify(lista));
      }
    </script>
  </body>
</html>
